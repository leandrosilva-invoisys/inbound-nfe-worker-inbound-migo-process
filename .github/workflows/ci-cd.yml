name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'src/invs-template-worker.sln'
  TEST_PROJECT_PATH: 'src/invs-template-worker.Tests/invs-template-worker.Tests.csproj'
  WORKER_PROJECT_PATH: 'src/invs-template-worker'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build project
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run unit tests
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --no-restore \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory:"${{ github.workspace }}/TestResults"

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHubAction@5.2.0
        with:
          reports: '${{ github.workspace }}/TestResults/**/coverage.cobertura.xml'
          targetdir: '${{ github.workspace }}/CoverageReport'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

      - name: Check coverage threshold
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            -- /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: '${{ github.workspace }}/TestResults/**/coverage.cobertura.xml'
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.WORKER_PROJECT_PATH }}
          file: ./${{ env.WORKER_PROJECT_PATH }}/Dockerfile
          push: false
          tags: invs-template-worker:latest
          cache-from: type=registry,ref=invs-template-worker:buildcache
          cache-to: type=inline

      - name: Test Docker image (worker starts)
        run: |
          docker run --rm -d --name test-worker invs-template-worker:latest
          sleep 5
          docker stop test-worker
